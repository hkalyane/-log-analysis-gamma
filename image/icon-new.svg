<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D3748;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A202C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="filterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4299E1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3182CE;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="dotGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F56565;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E53E3E;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="dotGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#48BB78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38A169;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="dotGrad3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ECC94B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D69E2E;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bgGrad)" stroke="#4A5568" stroke-width="1"/>
  
  <!-- Filter funnel shape -->
  <path d="M 25 35 L 103 35 L 85 55 L 43 55 Z" fill="url(#filterGrad)" stroke="#2B6CB0" stroke-width="1"/>
  <rect x="60" y="55" width="8" height="25" fill="url(#filterGrad)"/>
  <rect x="55" y="80" width="18" height="8" fill="url(#filterGrad)" rx="4"/>
  
  <!-- Log lines with colored dots -->
  <g opacity="0.9">
    <!-- Line 1 -->
    <rect x="15" y="25" width="35" height="2" fill="#A0AEC0" rx="1"/>
    <circle cx="95" cy="26" r="4" fill="url(#dotGrad1)"/>
    
    <!-- Line 2 -->
    <rect x="15" y="45" width="28" height="2" fill="#A0AEC0" rx="1"/>
    <circle cx="95" cy="46" r="4" fill="url(#dotGrad2)"/>
    
    <!-- Line 3 (filtered out) -->
    <rect x="15" y="65" width="40" height="2" fill="#4A5568" opacity="0.3" rx="1"/>
    
    <!-- Line 4 -->
    <rect x="15" y="85" width="32" height="2" fill="#A0AEC0" rx="1"/>
    <circle cx="95" cy="86" r="4" fill="url(#dotGrad3)"/>
    
    <!-- Line 5 (filtered out) -->
    <rect x="15" y="105" width="45" height="2" fill="#4A5568" opacity="0.3" rx="1"/>
  </g>
  
  <!-- Gamma symbol -->
  <text x="100" y="115" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9F7AEA">γ</text>
  
  <!-- Highlight overlay for active filters -->
  <g opacity="0.6">
    <rect x="14" y="24" width="37" height="4" fill="#F56565" rx="2" opacity="0.3"/>
    <rect x="14" y="44" width="30" height="4" fill="#48BB78" rx="2" opacity="0.3"/>
    <rect x="14" y="84" width="34" height="4" fill="#ECC94B" rx="2" opacity="0.3"/>
  </g>
</svg>